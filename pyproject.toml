[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "asc-oven-control"
version = "0.1.0"
description = "Modern PySide6 replacement for the ASC LabVIEW thermal oven controller"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.7,<7",
    "pyserial>=3.5,<4",
]

[project.scripts]
asc-oven-control = "asc_oven_control.app:main"

[tool.setuptools.packages.find]
include = ["asc_oven_control*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
